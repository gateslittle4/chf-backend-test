# Mises à jour automatiques des composants (15/10) : UNE PR par mois (les mises à jour groupées), jamais fusionnée toute seule.
# Chaque PR doit passer les tests (.github/workflows/tests.yml) avant d'être fusionnée par une personne.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      mises-a-jour-mensuelles:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
