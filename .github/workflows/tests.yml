# Tests automatiques du serveur (15/10). ÉTAT : PRÉPARÉ, PAS ACTIVÉ — déclenchement MANUEL seulement (onglet Actions → « Tests » → Run workflow).
# Pour l'activer à chaque PR : remplacer `workflow_dispatch:` par
#   pull_request:
#   push:
#     branches: [main]
# puis, dans GitHub → Settings → Branches → règle sur `main` → « Require status checks » → cocher « tests ».
name: Tests
on:
  workflow_dispatch:
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
