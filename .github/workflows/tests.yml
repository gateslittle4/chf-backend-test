# Tests automatiques du serveur. ACTIVÉS le 16/10 : ils tournent à chaque pull request et à chaque envoi sur `main`.
# Pour qu'un test rouge BLOQUE la fusion : GitHub → Settings → Branches → règle sur `main` → « Require status checks to pass » → cocher « tests ».
name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
